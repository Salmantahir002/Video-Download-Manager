<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT-DLP Web | Download Videos & Audio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-effects">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <main class="container">
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1>YT-DLP Web</h1>
            </div>
            <p class="tagline">Download YouTube videos & audio with ease</p>
        </header>

        <div class="card main-card">
            <!-- Video Preview -->
            <div class="video-preview" id="videoPreview">
                <div class="preview-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M10 9L15 12L10 15V9Z" fill="currentColor"/>
                    </svg>
                    <span>Paste a URL to preview</span>
                </div>
                <div class="preview-content" id="previewContent">
                    <img id="thumbnail" src="" alt="Video thumbnail">
                    <div class="preview-info">
                        <h3 id="videoTitle"></h3>
                        <p id="videoUploader"></p>
                    </div>
                </div>
            </div>

            <!-- URL Input -->
            <div class="input-group">
                <label for="urlInput">Video URL</label>
                <div class="input-wrapper">
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="https://youtube.com/watch?v=..." 
                        autocomplete="off"
                    >
                    <button class="paste-btn" id="pasteBtn" title="Paste from clipboard">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 4H18C19.1046 4 20 4.89543 20 6V20C20 21.1046 19.1046 22 18 22H6C4.89543 22 4 21.1046 4 20V6C4 4.89543 4.89543 4 6 4H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mode Toggle -->
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="video" id="videoModeBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M10 9L15 12L10 15V9Z" fill="currentColor"/>
                    </svg>
                    Video
                </button>
                <button class="mode-btn" data-mode="audio" id="audioModeBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18V5L21 3V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                        <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    Audio
                </button>
            </div>

            <!-- Quality Selection -->
            <div class="options-row">
                <div class="select-group" id="videoOptions">
                    <label for="qualitySelect">Quality</label>
                    <select id="qualitySelect">
                        <option value="best">Best Quality</option>
                        <option value="2160">4K (2160p)</option>
                        <option value="1440">2K (1440p)</option>
                        <option value="1080">Full HD (1080p)</option>
                        <option value="720">HD (720p)</option>
                        <option value="480">SD (480p)</option>
                        <option value="360">Low (360p)</option>
                    </select>
                </div>

                <div class="select-group hidden" id="audioOptions">
                    <label for="audioFormatSelect">Format</label>
                    <select id="audioFormatSelect">
                        <option value="mp3">MP3 (Most Compatible)</option>
                        <option value="opus">Opus (Best Quality)</option>
                        <option value="m4a">M4A (Apple)</option>
                        <option value="flac">FLAC (Lossless)</option>
                        <option value="wav">WAV (Uncompressed)</option>
                    </select>
                </div>
            </div>

            <!-- Download Button -->
            <button class="download-btn" id="downloadBtn">
                <svg class="download-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="btn-text">Download</span>
                <div class="loading-spinner"></div>
            </button>

            <!-- Progress -->
            <div class="progress-section hidden" id="progressSection">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">Starting download...</p>
                <button class="stop-btn" id="stopBtn" title="Stop Download">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>
                    </svg>
                    <span>Stop Download</span>
                </button>
            </div>

            <!-- Status Messages -->
            <div class="status-message hidden" id="statusMessage">
                <div class="status-icon"></div>
                <span class="status-text"></span>
            </div>
        </div>

        <footer class="footer">
            <p>Downloads are saved to <code>D:\yt_dlp\downloads\</code></p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
