<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Manager — Download Videos & Audio Instantly</title>
    <meta name="description" content="A sleek, zero-setup desktop application to download YouTube videos and audio in any quality. Powered by yt-dlp.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-canvas" id="bgCanvas">
        <div class="bg-grain"></div>
        <div class="bg-glow bg-glow--1"></div>
        <div class="bg-glow bg-glow--2"></div>
        <div class="bg-glow bg-glow--3"></div>
    </div>

    <div class="app-shell">
        <!-- Top bar -->
        <nav class="topbar" id="topbar">
            <div class="topbar__brand">
                <div class="topbar__logo">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#logoGrad)" stroke-width="2.5"/>
                        <path d="M11 9.5L18.5 14L11 18.5V9.5Z" fill="url(#logoGrad)"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="2" y1="2" x2="26" y2="26">
                                <stop stop-color="#FF6B6B"/>
                                <stop offset="1" stop-color="#FF8E53"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="topbar__title">Video Manager</span>
            </div>
            <div class="topbar__status">
                <span class="status-dot"></span>
                <span class="status-label">Engine Online</span>
            </div>
        </nav>

        <!-- Main content -->
        <main class="main">
            <!-- Hero section -->
            <section class="hero">
                <h1 class="hero__title">
                    Download <span class="hero__accent">Any Video</span><br>
                    in Seconds
                </h1>
                <p class="hero__sub">Paste a YouTube URL, choose your quality, and hit download. It's that simple.</p>
            </section>

            <!-- Downloader Card -->
            <section class="downloader" id="downloaderCard">
                <!-- Video Preview Area -->
                <div class="preview" id="videoPreview">
                    <div class="preview__placeholder" id="previewPlaceholder">
                        <div class="preview__icon-wrap">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <span>Paste a link to see the preview</span>
                    </div>
                    <div class="preview__content" id="previewContent">
                        <img id="thumbnail" src="" alt="Video thumbnail">
                        <div class="preview__info">
                            <h3 id="videoTitle"></h3>
                            <p id="videoUploader"></p>
                        </div>
                    </div>
                </div>

                <!-- URL Input -->
                <div class="field" id="urlField">
                    <label for="urlInput" class="field__label">Video URL</label>
                    <div class="field__row">
                        <div class="field__input-wrap">
                            <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                                <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                            </svg>
                            <input
                                type="url"
                                id="urlInput"
                                placeholder="https://youtube.com/watch?v=..."
                                autocomplete="off"
                                spellcheck="false"
                            >
                        </div>
                        <button class="btn-icon" id="pasteBtn" title="Paste from clipboard" aria-label="Paste URL">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <path d="M16 4H18C19.1046 4 20 4.89543 20 6V20C20 21.1046 19.1046 22 18 22H6C4.89543 22 4 21.1046 4 20V6C4 4.89543 4.89543 4 6 4H8"/>
                                <rect x="8" y="2" width="8" height="4" rx="1"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Mode & Options Row -->
                <div class="controls">
                    <!-- Mode Toggle -->
                    <div class="toggle" id="modeToggle">
                        <div class="toggle__track">
                            <div class="toggle__slider" id="toggleSlider"></div>
                            <button class="toggle__btn active" data-mode="video" id="videoModeBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                                    <path d="M10 9l5 3-5 3V9z" fill="currentColor"/>
                                </svg>
                                <span>Video</span>
                            </button>
                            <button class="toggle__btn" data-mode="audio" id="audioModeBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 18V5l12-2v13"/>
                                    <circle cx="6" cy="18" r="3"/>
                                    <circle cx="18" cy="16" r="3"/>
                                </svg>
                                <span>Audio</span>
                            </button>
                        </div>
                    </div>

                    <!-- Quality / Format selectors -->
                    <div class="options-row">
                        <div class="select-group" id="videoOptions">
                            <label for="qualitySelect" class="field__label">Quality</label>
                            <div class="select-wrap">
                                <select id="qualitySelect">
                                    <option value="best">Best Available</option>
                                    <option value="2160">4K · 2160p</option>
                                    <option value="1440">2K · 1440p</option>
                                    <option value="1080">Full HD · 1080p</option>
                                    <option value="720">HD · 720p</option>
                                    <option value="480">SD · 480p</option>
                                    <option value="360">Low · 360p</option>
                                </select>
                                <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                            </div>
                        </div>

                        <div class="select-group hidden" id="audioOptions">
                            <label for="audioFormatSelect" class="field__label">Format</label>
                            <div class="select-wrap">
                                <select id="audioFormatSelect">
                                    <option value="mp3">MP3 — Universal</option>
                                    <option value="opus">Opus — Best Quality</option>
                                    <option value="m4a">M4A — Apple</option>
                                    <option value="flac">FLAC — Lossless</option>
                                    <option value="wav">WAV — Raw</option>
                                </select>
                                <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Download Button -->
                <button class="btn-download" id="downloadBtn">
                    <svg class="download-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span class="btn-text">Download Now</span>
                    <div class="loading-spinner"></div>
                </button>

                <!-- Progress -->
                <div class="progress hidden" id="progressSection">
                    <div class="progress__bar-track">
                        <div class="progress__bar-fill" id="progressFill"></div>
                    </div>
                    <p class="progress__text" id="progressText">Preparing download…</p>
                    <button class="btn-stop" id="stopBtn" title="Cancel Download">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>
                        </svg>
                        <span>Cancel</span>
                    </button>
                </div>

                <!-- Status -->
                <div class="toast hidden" id="statusMessage">
                    <div class="status-icon"></div>
                    <span class="status-text"></span>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Downloads are saved to your <code>Downloads/YT-Downloads</code> folder</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
